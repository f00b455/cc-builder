spring:
  application:
    name: ${APP_NAME:app}

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # H2 (default / test)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Graceful shutdown (K8s)
  lifecycle:
    timeout-per-shutdown-phase: 30s

# Actuator (K8s health probes)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Server
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

---
# Production profile (PostgreSQL)
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/app}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER:app}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
