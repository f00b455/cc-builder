name: 'CC-Builder'
description: 'Generate production-ready code from a story using Claude Code'
author: 'cc-builder'

branding:
  icon: 'code'
  color: 'orange'

inputs:
  story:
    description: 'Story text or path to story file'
    required: true
  language:
    description: 'Target language (go, python, java, kotlin, auto)'
    required: false
    default: 'auto'
  coverage:
    description: 'Coverage target percentage'
    required: false
    default: '80'
  max-iterations:
    description: 'Maximum TDD iterations'
    required: false
    default: '10'
  branch:
    description: 'Target branch name'
    required: false
    default: ''
  claude-token:
    description: 'Claude OAuth token (Max Plan) or API key'
    required: true
  create-pr:
    description: 'Create PR after generation'
    required: false
    default: 'true'

outputs:
  branch:
    description: 'Branch name with generated code'
    value: ${{ steps.generate.outputs.branch }}
  coverage:
    description: 'Achieved coverage percentage'
    value: ${{ steps.generate.outputs.coverage }}
  pr-url:
    description: 'URL of created PR (if create-pr is true)'
    value: ${{ steps.pr.outputs.url }}

runs:
  using: 'composite'
  steps:
    - name: Determine image
      id: image
      shell: bash
      run: |
        case "${{ inputs.language }}" in
          go) echo "image=ghcr.io/${{ github.repository_owner }}/cc-builder:go" >> $GITHUB_OUTPUT ;;
          python) echo "image=ghcr.io/${{ github.repository_owner }}/cc-builder:python" >> $GITHUB_OUTPUT ;;
          java|kotlin) echo "image=ghcr.io/${{ github.repository_owner }}/cc-builder:jvm" >> $GITHUB_OUTPUT ;;
          *) echo "image=ghcr.io/${{ github.repository_owner }}/cc-builder:go" >> $GITHUB_OUTPUT ;;
        esac

    - name: Determine branch
      id: branch
      shell: bash
      run: |
        if [ -n "${{ inputs.branch }}" ]; then
          echo "name=${{ inputs.branch }}" >> $GITHUB_OUTPUT
        else
          echo "name=feature/cc-builder-$(date +%s)" >> $GITHUB_OUTPUT
        fi

    - name: Generate code
      id: generate
      shell: bash
      run: |
        # Check if story is a file path or inline text
        if [ -f "${{ inputs.story }}" ]; then
          STORY=$(cat "${{ inputs.story }}")
        else
          STORY="${{ inputs.story }}"
        fi

        # Run cc-builder
        echo "$STORY" | docker run -i --rm \
          -v ${{ github.workspace }}:/workspace \
          -e CLAUDE_CODE_OAUTH_TOKEN="${{ inputs.claude-token }}" \
          ${{ steps.image.outputs.image }} \
          --language ${{ inputs.language }} \
          --coverage ${{ inputs.coverage }} \
          --max-iterations ${{ inputs.max-iterations }} \
          --branch ${{ steps.branch.outputs.name }}

        echo "branch=${{ steps.branch.outputs.name }}" >> $GITHUB_OUTPUT

        # Extract coverage from report
        if [ -f REPORT.md ]; then
          COVERAGE=$(grep -oP 'Achieved.*?\K[\d.]+(?=%)' REPORT.md || echo "0")
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        fi

    - name: Push branch
      shell: bash
      run: |
        git push origin ${{ steps.branch.outputs.name }}

    - name: Create PR
      id: pr
      if: inputs.create-pr == 'true'
      shell: bash
      run: |
        PR_URL=$(gh pr create \
          --title "feat: AI-generated implementation" \
          --body "$(cat REPORT.md 2>/dev/null || echo 'Generated by cc-builder')" \
          --head ${{ steps.branch.outputs.name }} \
          --base ${{ github.event.repository.default_branch }})
        echo "url=$PR_URL" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}
