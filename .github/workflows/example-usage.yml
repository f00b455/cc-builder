# Example: Generate code from GitHub Issue
#
# Trigger: Add label "ai-generate" to an issue
# Result: PR with generated code

name: AI Code Generation

on:
  issues:
    types: [labeled]

jobs:
  generate:
    if: contains(github.event.issue.labels.*.name, 'ai-generate')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate from Issue
        uses: ./
        with:
          story: |
            ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
          language: auto
          coverage: '80'
          branch: 'feature/issue-${{ github.event.issue.number }}'
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          create-pr: 'true'

      - name: Comment on Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 Code generated! Check the PR linked above.'
            })
